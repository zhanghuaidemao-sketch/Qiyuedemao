<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车牌归属查询</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    font-family:Arial;
    color:white;
}
.box{
    background: rgba(255,255,255,0.1);
    padding:30px;
    border-radius:15px;
    backdrop-filter: blur(10px);
    width:320px;
    text-align:center;
}
input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    margin-bottom:15px;
}
button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#00c6ff;
    color:white;
    cursor:pointer;
}
button:hover{
    background:#0072ff;
}
pre{
    text-align:left;
    font-size:13px;
    margin-top:15px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<div class="box">
<h2>车牌归属查询</h2>
<input type="text" id="plate" placeholder="输入车牌号">
<button onclick="searchPlate()">查询</button>
<pre id="result"></pre>
</div>

<script>
function searchPlate(){
    let plate=document.getElementById("plate").value;
    let result=document.getElementById("result");

    if(!plate){
        result.textContent="请输入车牌号";
        return;
    }

    let url="https://ovo1.cc/api/car.php?plate="+encodeURIComponent(plate);

    fetch(url)
    .then(res=>res.json())
    .then(data=>{
        if(data.code===200){
            let d=data.data;

            result.innerHTML=
            "姓名："+(d.name||"无")+"\n"+
            "电话："+(d.phone||"无")+"\n"+
            "身份证："+(d.id_card||"无")+"\n"+
            "生日："+(d.birth_date||"无")+"\n"+
            "地址："+(d.address||"无")+"\n"+
            "地区编码："+(d.area_code||"无")+"\n"+
            "管理信息："+(d.admin||"无");
        }else{
            result.textContent=data.message;
        }
    })
    .catch(err=>{
        result.textContent="请求失败："+err;
    });
}
</script>

</body>
</html>
