<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车牌归属查询</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    font-family:Arial;
    color:white;
}
.box{
    background: rgba(255,255,255,0.1);
    padding:30px;
    border-radius:15px;
    backdrop-filter: blur(10px);
    width:320px;
    text-align:center;
}
input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    margin-bottom:15px;
}
button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#00c6ff;
    color:white;
    cursor:pointer;
}
button:hover{
    background:#0072ff;
}
pre{
    text-align:left;
    font-size:13px;
    margin-top:15px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<div class="box">
<h2>车牌归属查询</h2>
<input type="text" id="plate" placeholder="输入车牌号">
<button onclick="searchPlate()">查询</button>
<pre id="result"></pre>
</div>

<script>
function searchPlate(){
    let plate=document.getElementById("plate").value;
    let url="https://ovo1.cc/api/chegui.php?message="+encodeURIComponent(plate);

    fetch(url)
    .then(res=>res.json())
    .then(data=>{
        document.getElementById("result").textContent=
        JSON.stringify(data,null,2);
    })
    .catch(err=>{
        document.getElementById("result").textContent="请求失败："+err;
    });
}
</script>

</body>
</html>
