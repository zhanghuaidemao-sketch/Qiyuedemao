<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>车归查询</title>
</head>
<body>

<h2>车牌查询</h2>

<input type="text" id="plate" placeholder="请输入车牌号">
<button onclick="searchPlate()">查询</button>

<pre id="result"></pre>

<script>
function searchPlate() {
    var plate = document.getElementById("plate").value;
    var url = "https://ovo1.cc/api/chegui.php?message=" + encodeURIComponent(plate);

    fetch(url)
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").textContent =
            JSON.stringify(data, null, 2);
    })
    .catch(error => {
        document.getElementById("result").textContent =
            "请求失败：" + error;
    });
}
</script>

</body>
</html>
