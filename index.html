<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>查询车辆轨迹</title>

<!-- 高德地图 -->
<script src="https://webapi.amap.com/maps?v=2.0&key=YOUR_AMAP_KEY_HERE"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}
header {
    background: #1677ff;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}
#map {
    height: 60vh;
}
.panel {
    padding: 20px;
    background: #f5f5f5;
}
input {
    padding: 8px;
    margin: 5px 0;
    width: 220px;
    border-radius: 5px;
    border: 1px solid #ccc;
}
button {
    padding: 8px 16px;
    border: none;
    border-radius: 5px;
    background: #1677ff;
    color: white;
    cursor: pointer;
}
button:hover {
    background: #0958d9;
}
.info {
    margin-top: 10px;
    font-size: 14px;
}
</style>
</head>
<body>

<header>查询车辆轨迹</header>

<div id="map"></div>

<div class="panel">

    <label>车辆编号：</label><br>
    <input id="carId" placeholder="例如：CAR001"><br>

    <label>开始时间：</label><br>
    <input type="datetime-local" id="startTime"><br>

    <label>结束时间：</label><br>
    <input type="datetime-local" id="endTime"><br><br>

    <button onclick="queryTrack()">查询轨迹</button>

    <div class="info" id="info"></div>

</div>

<script>

// 初始化地图
var map = new AMap.Map('map', {
    zoom: 12,
    center: [110.75, 32.65]
});

var polyline = null;
var startMarker = null;
var endMarker = null;

// 模拟轨迹数据（演示用）
function generateTrack() {
    var path = [];
    var baseLng = 110.75;
    var baseLat = 32.65;

    for (var i = 0; i < 25; i++) {
        path.push([
            baseLng + i * 0.01,
            baseLat + Math.sin(i/3) * 0.02
        ]);
    }
    return path;
}

// 查询轨迹
function queryTrack() {

    var carId = document.getElementById("carId").value;
    var startTime = document.getElementById("startTime").value;
    var endTime = document.getElementById("endTime").value;

    if (!carId || !startTime || !endTime) {
        alert("请填写完整信息");
        return;
    }

    var track = generateTrack();

    if (polyline) polyline.setMap(null);
    if (startMarker) startMarker.setMap(null);
    if (endMarker) endMarker.setMap(null);

    polyline = new AMap.Polyline({
        path: track,
        strokeColor: "#ff0000",
        strokeWeight: 5
    });

    map.add(polyline);
    map.setFitView();

    startMarker = new AMap.Marker({
        position: track[0],
        label: { content: "起点" }
    });

    endMarker = new AMap.Marker({
        position: track[track.length - 1],
        label: { content: "终点" }
    });

    map.add(startMarker);
    map.add(endMarker);

    document.getElementById("info").innerHTML =
        "车辆编号：" + carId +
        "<br>轨迹点数：" + track.length +
        "<br>时间范围：" + startTime + " 至 " + endTime;
}

</script>

</body>
</html>
