<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>车辆轨迹查询系统</title>

<!-- 高德地图 -->
<script src="https://webapi.amap.com/maps?v=2.0&key=YOUR_AMAP_KEY_HERE"></script>

<style>
body { margin:0; font-family:Arial; }
#map { height:55vh; }
.panel { padding:15px; background:#f5f5f5; }
input { padding:8px; margin:5px 0; width:220px; border-radius:5px; border:1px solid #ccc; }
button { padding:8px 14px; border:none; border-radius:5px; background:#1677ff; color:white; cursor:pointer; }
button:hover { background:#0958d9; }
.result { margin-top:10px; font-size:14px; }
</style>
</head>
<body>

<h2 style="text-align:center;">🚗 车辆轨迹查询系统</h2>

<div id="map"></div>

<div class="panel">
    <label>车辆ID：</label><br>
    <input id="carId" placeholder="例如：CAR001"><br>

    <label>开始时间：</label><br>
    <input type="datetime-local" id="startTime"><br>

    <label>结束时间：</label><br>
    <input type="datetime-local" id="endTime"><br><br>

    <button onclick="queryTrack()">查询轨迹</button>

    <div class="result" id="resultInfo"></div>
</div>

<script>

// 初始化地图
var map = new AMap.Map('map', {
    zoom: 12,
    center: [110.75, 32.65]
});

var polyline = null;
var startMarker = null;
var endMarker = null;

// 模拟轨迹数据生成
function generateMockTrack() {
    var path = [];
    var baseLng = 110.75;
    var baseLat = 32.65;

    for (var i = 0; i < 30; i++) {
        path.push([
            baseLng + i * 0.01,
            baseLat + Math.sin(i/3) * 0.02
        ]);
    }
    return path;
}

// 查询轨迹
function queryTrack() {

    var carId = document.getElementById("carId").value;
    var startTime = document.getElementById("startTime").value;
    var endTime = document.getElementById("endTime").value;

    if (!carId || !startTime || !endTime) {
        alert("请填写完整信息");
        return;
    }

    // 模拟查询
    var trackData = generateMockTrack();

    if (polyline) polyline.setMap(null);
    if (startMarker) startMarker.setMap(null);
    if (endMarker) endMarker.setMap(null);

    polyline = new AMap.Polyline({
        path: trackData,
        strokeColor: "#ff0000",
        strokeWeight: 5
    });

    map.add(polyline);
    map.setFitView();

    startMarker = new AMap.Marker({
        position: trackData[0],
        label: { content: "起点", offset: new AMap.Pixel(0, -20) }
    });

    endMarker = new AMap.Marker({
        position: trackData[trackData.length - 1],
        label: { content: "终点", offset: new AMap.Pixel(0, -20) }
    });

    map.add(startMarker);
    map.add(endMarker);

    document.getElementById("resultInfo").innerHTML =
        "车辆ID：" + carId +
        "<br>轨迹点数量：" + trackData.length +
        "<br>时间范围：" + startTime + " 至 " + endTime;
}

</script>

</body>
</html>
