<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>车辆轨迹跟踪与导航系统</title>

<script src="https://webapi.amap.com/maps?v=2.0&key=835646d2a34ab928aa8c50d49e8aea76"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;}
#container{height:60vh;}
.panel{padding:15px;background:#111827;}
input,textarea,button{padding:6px;margin:4px;border-radius:6px;border:none;}
button{background:#06b6d4;color:white;cursor:pointer;}
button:hover{background:#0891b2;}
#routeSteps{max-height:150px;overflow:auto;font-size:13px;}
.analysis{background:#1e293b;padding:10px;margin-top:10px;}
</style>
</head>

<body>

<h2 style="padding:10px;">车辆轨迹跟踪与导航系统</h2>

<div id="container"></div>

<div class="panel">

<textarea id="nmeaInput" rows="5" cols="60" placeholder="粘贴GPRMC导航电文"></textarea><br>
<button onclick="loadNMEA()">解析并显示轨迹</button>
<button onclick="loadStaticTrack()">显示静态轨迹</button>
<button onclick="analyzeTrack()">分析轨迹</button>

<hr>

<input id="origin" placeholder="起点 lng,lat">
<input id="destination" placeholder="终点 lng,lat">
<button onclick="planRoute()">路径规划</button>

<ul id="routeSteps"></ul>

<div class="analysis" id="analysisPanel" style="display:none;"></div>

</div>

<script>

var map = new AMap.Map('container',{
    zoom:12,
    center:[110.75,32.65]
});

var polyline=null;
var marker=null;
var currentPoints=[];

// 画轨迹
function drawTrack(points){

if(polyline) map.remove(polyline);

let path=points.map(p=>[p.lng,p.lat]);

polyline=new AMap.Polyline({
    path:path,
    strokeColor:"#00FFFF",
    strokeWeight:5
});
map.add(polyline);
map.setFitView();
}

// ===== 调用 Flask 静态轨迹 API =====
function loadStaticTrack(){

fetch("/api/track")
.then(res=>res.json())
.then(data=>{
    currentPoints=data;
    drawTrack(data);
});
}

// ===== 调用 Flask 解析NMEA API =====
function loadNMEA(){

let text=document.getElementById("nmeaInput").value;

fetch("/api/parse_nmea_batch",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({nmea:text})
})
.then(res=>res.json())
.then(data=>{
    currentPoints=data;
    drawTrack(data);
});
}

// ===== 调用 Flask 轨迹分析 API =====
function analyzeTrack(){

fetch("/api/analyze_track",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({points:currentPoints})
})
.then(res=>res.json())
.then(data=>{
    let html="";
    html+="总距离："+data.total_distance+" km<br>";
    html+="平均速度："+data.avg_speed+" m/s<br>";
    html+="最大速度："+data.max_speed+" m/s<br>";
    html+="持续时间："+data.duration+" 小时<br>";
    html+="轨迹点数："+data.point_count+"<br>";

    document.getElementById("analysisPanel").innerHTML=html;
    document.getElementById("analysisPanel").style.display="block";
});
}

// ===== 调用 Flask 路径规划 API =====
function planRoute(){

let origin=document.getElementById("origin").value;
let dest=document.getElementById("destination").value;

fetch(`/api/route?origin=${origin}&destination=${dest}`)
.then(res=>res.json())
.then(data=>{

    if(data.polyline){

        let path=data.polyline.map(p=>[p.lng,p.lat]);

        let routeLine=new AMap.Polyline({
            path:path,
            strokeColor:"#FF0000",
            strokeWeight:6
        });
        map.add(routeLine);
        map.setFitView();

        document.getElementById("routeSteps").innerHTML="";
        data.steps.forEach(step=>{
            let li=document.createElement("li");
            li.innerText=step;
            document.getElementById("routeSteps").appendChild(li);
        });
    }
});
}

</script>

</body>
</html>
