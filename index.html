<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>车辆轨迹查询系统</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0f172a; color:white; }
#map { height:85vh; }

.control {
    padding:12px;
    background:#111827;
    display:flex;
    gap:10px;
    align-items:center;
}

input {
    padding:6px;
    border-radius:6px;
    border:none;
}

button {
    padding:6px 12px;
    background:#06b6d4;
    border:none;
    border-radius:6px;
    color:white;
    cursor:pointer;
}

button:hover {
    background:#0891b2;
}

#info {
    padding:8px 12px;
    background:#1e293b;
    font-size:14px;
}
</style>
</head>
<body>

<div class="control">
车牌号：
<input type="text" id="plate" placeholder="请输入车牌">
<button onclick="searchTrack()">查询轨迹</button>
</div>

<div id="info">当前位置：-</div>
<div id="map"></div>

<script>
var map = L.map('map').setView([22.5431,114.0579],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

var polyline=null;
var marker=null;
var interval=null;

var carIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/744/744465.png",
    iconSize: [32,32],
    iconAnchor: [16,16]
});

// 生成轨迹
function generateTrack(plate){

    var base_lat = 22.5431;
    var base_lng = 114.0579;
    var path=[];

    var offset = plate.length * 0.005;

    for(var i=0;i<20;i++){
        path.push([
            base_lat + i*0.01 + offset,
            base_lng + i*0.008 + offset
        ]);
    }

    return path;
}

function searchTrack(){

var plate=document.getElementById("plate").value.trim();
if(!plate){alert("请输入车牌号！");return;}

var path=generateTrack(plate);

if(polyline) map.removeLayer(polyline);
if(marker) map.removeLayer(marker);
if(interval) clearInterval(interval);

// 轨迹线
polyline=L.polyline(path,{
    color:'#22d3ee',
    weight:5
}).addTo(map);

// 小车图标
marker=L.marker(path[0],{icon:carIcon}).addTo(map);

map.fitBounds(polyline.getBounds());

var i=0;
interval=setInterval(function(){
    if(i>=path.length){
        clearInterval(interval);
        return;
    }

    marker.setLatLng(path[i]);

    document.getElementById("info").innerHTML =
        "当前位置：纬度 " + path[i][0].toFixed(5) +
        " , 经度 " + path[i][1].toFixed(5);

    i++;
},500);

}
</script>

</body>
</html>
