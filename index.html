<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>智能车辆监控系统</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

.login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#1e293b;
    padding:40px;
    border-radius:10px;
    width:300px;
    text-align:center;
}

input{
    width:85%;
    padding:10px;
    margin:10px 0;
    border-radius:5px;
    border:none;
}

button{
    padding:10px 20px;
    background:#3b82f6;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.header{
    height:60px;
    background:#111827;
    display:flex;
    align-items:center;
    padding-left:20px;
    font-size:20px;
}

.main{
    padding:20px;
}

#map{
    height:400px;
    margin-top:20px;
    border-radius:10px;
}
</style>

<script>

var map;
var marker;
var polyline;

/* 模拟用户 */
var users = {
    "admin":"888888",
    "test":"123456"
};

/* 登录 */
function login(){

    var user = document.getElementById("user").value;
    var pass = document.getElementById("pass").value;

    if(users[user] && users[user] === pass){
        document.getElementById("loginPage").style.display="none";
        document.getElementById("systemPage").style.display="block";
        initMap();
    }else{
        alert("账号或密码错误！");
    }
}

/* 查询轨迹 */
function searchTrack(){

    var plate = document.getElementById("plate").value;

    if(plate===""){
        alert("请输入车牌号");
        return;
    }

    var base_lat = 22.5431;
    var base_lng = 114.0579;

    var path = [];
    for(var i=0;i<15;i++){
        path.push([
            base_lat + i*0.005,
            base_lng + i*0.005
        ]);
    }

    if(polyline) map.removeLayer(polyline);
    if(marker) map.removeLayer(marker);

    polyline = L.polyline(path,{color:'cyan'}).addTo(map);
    marker = L.marker(path[0]).addTo(map);

    var i = 0;
    var interval = setInterval(function(){
        if(i >= path.length){
            clearInterval(interval);
            return;
        }
        marker.setLatLng(path[i]);
        i++;
    },800);
}

/* 初始化地图 */
function initMap(){
    map = L.map('map').setView([22.5431,114.0579],13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'© OpenStreetMap'
    }).addTo(map);
}

</script>

</head>

<body>

<div id="loginPage" class="login">
    <div class="login-box">
        <h2>系统登录</h2>
        <input type="text" id="user" placeholder="用户名"><br>
        <input type="password" id="pass" placeholder="密码"><br>
        <button onclick="login()">登录</button>
        <p style="font-size:12px;margin-top:10px;">
        admin / 888888<br>
        test / 123123
        </p>
    </div>
</div>

<div id="systemPage" style="display:none;">

<div class="header">
🚗 智能车辆监控后台系统
</div>

<div class="main">
    <h3>车辆轨迹查询</h3>
    <input type="text" id="plate" placeholder="请输入车牌号">
    <button onclick="searchTrack()">查询</button>
    <div id="map"></div>
</div>

</div>

</body>
</html>
