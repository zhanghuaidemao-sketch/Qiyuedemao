<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>车辆轨迹查询系统</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet 地图库 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- 科技字体 -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
    color: white;
    overflow: hidden;
}

#map {
    height: 100vh;
    width: 100%;
    filter: brightness(0.9) contrast(1.2);
}

.panel {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px #00f7ff;
}

input {
    padding: 8px;
    border: none;
    border-radius: 5px;
    margin-top: 10px;
    width: 200px;
}

button {
    padding: 8px 12px;
    margin-top: 10px;
    background: #00f7ff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #00c6ff;
}

.music-btn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: #ff00c8;
    box-shadow: 0 0 15px #ff00c8;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">
    <h2>🚗 车辆轨迹查询</h2>
    <input type="text" id="plate" placeholder="输入车牌号">
    <br>
    <button onclick="startTracking()">开始查询</button>
</div>

<button class="music-btn" onclick="toggleMusic()">🎵 Mood音乐</button>

<audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5fba9f0a67.mp3?filename=chill-abstract-intention-12099.mp3" type="audio/mpeg">
</audio>

<script>
var map = L.map('map').setView([39.9, 116.4], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

var vehicleIcon = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/743/743922.png',
    iconSize: [40, 40]
});

var marker;
var polyline;
var trackCoords = [
    [39.90, 116.40],
    [39.91, 116.41],
    [39.92, 116.42],
    [39.93, 116.43],
    [39.94, 116.44]
];

function startTracking() {
    if (marker) {
        map.removeLayer(marker);
        map.removeLayer(polyline);
    }

    polyline = L.polyline([], {color: '#00f7ff', weight: 5}).addTo(map);
    marker = L.marker(trackCoords[0], {icon: vehicleIcon}).addTo(map);

    let i = 0;
    let interval = setInterval(() => {
        if (i >= trackCoords.length) {
            clearInterval(interval);
            return;
        }
        marker.setLatLng(trackCoords[i]);
        polyline.addLatLng(trackCoords[i]);
        map.panTo(trackCoords[i]);
        i++;
    }, 1000);
}

function toggleMusic() {
    var music = document.getElementById("bgMusic");
    if (music.paused) {
        music.play();
    } else {
        music.pause();
    }
}
</script>

</body>
</html>
