<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>车辆轨迹查询系统</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; background:#111; color:white; }
#map { height:90vh; }
.control { padding:10px; background:#000; }
input { padding:5px; }
button { padding:5px 10px; cursor:pointer; }
</style>
</head>
<body>

<div class="control">
车牌号：
<input type="text" id="plate" placeholder="请输入车牌">
<button onclick="searchTrack()">查询轨迹</button>
</div>

<div id="map"></div>

<script>
var map = L.map('map').setView([22.5431,114.0579],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

var polyline=null;
var marker=null;
var interval=null;

// 模拟轨迹数据（根据车牌生成不同轨迹）
function generateTrack(plate){

    var base_lat = 22.5431;
    var base_lng = 114.0579;
    var path=[];

    var offset = plate.length * 0.005;

    for(var i=0;i<15;i++){
        path.push([
            base_lat + i*0.01 + offset,
            base_lng + i*0.008 + offset
        ]);
    }

    return path;
}

function searchTrack(){

var plate=document.getElementById("plate").value.trim();
if(!plate){alert("请输入车牌号！");return;}

var path=generateTrack(plate);

if(polyline) map.removeLayer(polyline);
if(marker) map.removeLayer(marker);
if(interval) clearInterval(interval);

polyline=L.polyline(path,{color:'cyan'}).addTo(map);
marker=L.marker(path[0]).addTo(map);

map.fitBounds(polyline.getBounds());

var i=0;
interval=setInterval(function(){
    if(i>=path.length){
        clearInterval(interval);
        return;
    }
    marker.setLatLng(path[i]);
    i++;
},600);

}
</script>

</body>
</html>
