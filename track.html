<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>车辆轨迹后台系统</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

/* 顶部栏 */
.header {
    height: 60px;
    background: #111827;
    display: flex;
    align-items: center;
    padding-left: 20px;
    font-size: 20px;
    border-bottom: 1px solid #1f2937;
}

/* 左侧菜单 */
.sidebar {
    width: 200px;
    height: calc(100vh - 60px);
    background: #111827;
    position: fixed;
    top: 60px;
    left: 0;
    padding-top: 20px;
}

.sidebar div {
    padding: 15px;
    cursor: pointer;
}

.sidebar div:hover {
    background: #1f2937;
}

/* 主内容 */
.main {
    margin-left: 200px;
    margin-top: 60px;
    padding: 40px;
}

/* 查询框 */
.card {
    background: #1e293b;
    padding: 30px;
    border-radius: 10px;
    width: 500px;
}

input {
    padding: 10px;
    font-size: 16px;
    border-radius: 5px;
    border: none;
    width: 250px;
}

button {
    padding: 10px 20px;
    background: #3b82f6;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    margin-left: 10px;
}

button:hover {
    background: #2563eb;
}

.result {
    margin-top: 20px;
    font-size: 15px;
    line-height: 25px;
}
</style>

<script>
function searchTrack() {
    var plate = document.getElementById("plate").value;

    if(plate === ""){
        alert("请输入车牌号！");
        return;
    }

    document.getElementById("result").innerHTML =
        "【系统查询结果】<br><br>" +
        "车牌号：" + plate + "<br>" +
        "状态：正常行驶<br>" +
        "最后位置：福田区<br><br>" +
        "轨迹记录：<br>" +
        "08:30 - 南山区<br>" +
        "09:15 - 深圳湾<br>" +
        "10:05 - 福田中心";
}
</script>

</head>

<body>

<div class="header">
🚗 智能车辆监控管理系统
</div>

<div class="sidebar">
    <div>📊 控制面板</div>
    <div>🚗 车辆管理</div>
    <div>📍 轨迹查询</div>
    <div>👤 用户管理</div>
    <div>⚙ 系统设置</div>
</div>

<div class="main">
    <div class="card">
        <h2>车辆轨迹查询</h2>
        <input type="text" id="plate" placeholder="请输入车牌号">
        <button onclick="searchTrack()">查询</button>
        <div class="result" id="result"></div>
    </div>
</div>

</body>
</html>
