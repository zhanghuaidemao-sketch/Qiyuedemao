<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>智能车辆监控系统</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    overflow:hidden;
}

#particles{
    position:absolute;
    width:100%;
    height:100%;
    background:black;
    z-index:-1;
}

.login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:rgba(30,41,59,0.9);
    padding:40px;
    border-radius:10px;
    width:300px;
    text-align:center;
}

input{
    width:85%;
    padding:10px;
    margin:10px 0;
    border-radius:5px;
    border:none;
}

button{
    padding:10px 20px;
    background:#3b82f6;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.header{
    height:60px;
    background:#111827;
    display:flex;
    align-items:center;
    padding-left:20px;
    font-size:20px;
}

.main{
    padding:20px;
}

#map{
    height:400px;
    margin-top:20px;
    border-radius:10px;
}
</style>

<script>

/* 多用户 */
var users = {};
users["112233"] = "142536";
users["admin"] = "888888";
users["test"] = "123123";

var failCount = 0;
var lock = false;

function login(){
    if(lock){
        alert("系统已锁定，请稍后再试！");
        return;
    }

    var user = document.getElementById("user").value;
    var pass = document.getElementById("pass").value;

    if(users[user] && users[user] === pass){
        document.getElementById("loginPage").style.display="none";
        document.getElementById("systemPage").style.display="block";
    }else{
        failCount++;
        if(failCount >= 3){
            lock = true;
            alert("错误3次，锁定30秒！");
            setTimeout(function(){
                lock = false;
                failCount = 0;
            },30000);
        }else{
            alert("账号或密码错误！");
        }
    }
}

/* 地图变量 */
var map;
var marker;
var polyline;

/* 查询车辆 */
function searchTrack(){

    var plate = document.getElementById("plate").value;
    if(plate===""){
        alert("请输入车牌号！");
        return;
    }

    var path = [
        [22.5431,114.0579],
        [22.5531,114.0679],
        [22.5631,114.0779],
        [22.5731,114.0879]
    ];

    if(polyline) map.removeLayer(polyline);
    if(marker) map.removeLayer(marker);

    polyline = L.polyline(path,{color:'cyan'}).addTo(map);
    marker = L.marker(path[0]).addTo(map);

    var i = 0;
    var interval = setInterval(function(){
        if(i >= path.length){
            clearInterval(interval);
            return;
        }
        marker.setLatLng(path[i]);
        i++;
    },1000);
}

/* 初始化地图 */
function initMap(){
    map = L.map('map').setView([22.5431,114.0579],13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'© OpenStreetMap'
    }).addTo(map);
}

/* 粒子效果 */
window.onload = function(){
    particlesJS("particles", {
        particles: {
            number: { value: 80 },
            size: { value: 3 },
            move: { speed: 2 },
            line_linked: { enable: true }
        }
    });
    initMap();
};
</script>

</head>

<body>

<!-- Mood 音乐 -->
<audio id="bgm" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="particles"></div>

<!-- 登录页 -->
<div id="loginPage" class="login">
    <div class="login-box">
        <h2>系统登录</h2>
        <input type="text" id="user" placeholder="用户名" autocomplete="off"><br>
        <input type="password" id="pass" placeholder="密码" autocomplete="off"><br>
        <button onclick="login();document.getElementById('bgm').play();">登录</button>
    </div>
</div>

<!-- 后台 -->
<div id="systemPage" style="display:none;">

<div class="header">
🚗 智能车辆监控后台系统
</div>

<div class="main">
    <h3>车辆轨迹查询</h3>
    <input type="text" id="plate" placeholder="请输入车牌号">
    <button onclick="searchTrack()">查询</button>

    <div id="map"></div>
</div>

</div>

</body>
</html>
