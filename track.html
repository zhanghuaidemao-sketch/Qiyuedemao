<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>智能车辆监控系统</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

/* 登录页 */
.login {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: #1e293b;
    padding: 40px;
    border-radius: 10px;
    width: 300px;
    text-align: center;
}

input {
    width: 80%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: none;
}

button {
    padding: 10px 20px;
    background: #3b82f6;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}

/* 后台 */
.header {
    height: 60px;
    background: #111827;
    display: flex;
    align-items: center;
    padding-left: 20px;
    font-size: 20px;
}

.main {
    padding: 20px;
}

#map {
    height: 500px;
    margin-top: 20px;
    border-radius: 10px;
}
</style>

<script>
function login(){
    var user = document.getElementById("user").value;
    var pass = document.getElementById("pass").value;

    // 已修改账号密码
    if(user === "112233" && pass === "142536"){
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("systemPage").style.display = "block";
    } else {
        alert("账号或密码错误！");
    }
}

var map;
var marker;
var path = [
    [22.5431,114.0579],
    [22.5531,114.0679],
    [22.5631,114.0779],
    [22.5731,114.0879]
];

function initMap(){
    map = L.map('map').setView([22.5431,114.0579],13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'© OpenStreetMap'
    }).addTo(map);

    L.polyline(path,{color:'cyan'}).addTo(map);

    marker = L.marker(path[0]).addTo(map);
}

function startTrack(){
    var i = 0;
    var interval = setInterval(function(){
        if(i >= path.length){
            clearInterval(interval);
            return;
        }
        marker.setLatLng(path[i]);
        i++;
    },1000);
}
</script>

</head>

<body>

<!-- 登录页面 -->
<div id="loginPage" class="login">
    <div class="login-box">
        <h2>系统登录</h2>
        <input type="text" id="user" placeholder="用户名"><br>
        <input type="password" id="pass" placeholder="密码"><br>
        <button onclick="login()">登录</button>
        <p style="font-size:12px;margin-top:10px;">
            账号：112233 密码：142536
        </p>
    </div>
</div>

<!-- 后台系统 -->
<div id="systemPage" style="display:none;">

<div class="header">
🚗 智能车辆监控后台系统
</div>

<div class="main">
    <button onclick="startTrack()">开始轨迹动画</button>
    <div id="map"></div>
</div>

</div>

<script>
window.onload = initMap;
</script>

</body>
</html>
