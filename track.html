<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>车辆轨迹查询系统</title>

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(-45deg, #141e30, #243b55, #0f2027, #203a43);
    background-size: 400% 400%;
    animation: bgMove 10s ease infinite;
}

@keyframes bgMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.box {
    background: rgba(0,0,0,0.6);
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,255,255,0.5);
}

h1 {
    margin-bottom: 30px;
}

input {
    padding: 10px;
    font-size: 18px;
    border-radius: 5px;
    border: none;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 5px;
    border: none;
    background: cyan;
    cursor: pointer;
    margin-left: 10px;
}

button:hover {
    background: #00ffffaa;
}

.result {
    margin-top: 30px;
    font-size: 18px;
}
</style>

<script>
function searchTrack() {
    var plate = document.getElementById("plate").value;

    if(plate === ""){
        alert("请输入车牌号！");
        return;
    }

    document.getElementById("result").innerHTML =
        "车辆 " + plate + " 的轨迹：<br><br>" +
        "📍 08:30 - 南山区<br>" +
        "📍 09:15 - 深圳湾<br>" +
        "📍 10:05 - 福田中心";
}
</script>

</head>

<body>

<div class="box">
    <h1>🚗 车辆轨迹查询系统</h1>
    <input type="text" id="plate" placeholder="请输入车牌号">
    <button onclick="searchTrack()">查询</button>
    <div class="result" id="result"></div>
</div>

</body>
</html>
