<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>智能车辆监控系统</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

.header{
    height:60px;
    background:#111827;
    display:flex;
    align-items:center;
    padding-left:20px;
    font-size:20px;
}

.main{
    padding:20px;
}

#map{
    height:500px;
    margin-top:20px;
    border-radius:10px;
}
button{
    padding:10px 20px;
    background:#3b82f6;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
🚗 智能车辆监控后台系统（免Key真实地图）
</div>

<div class="main">
    <button onclick="startTrack()">开始轨迹动画</button>
    <div id="map"></div>
</div>

<script>
var map = L.map('map').setView([22.5431,114.0579],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap'
}).addTo(map);

var path = [
    [22.5431,114.0579],
    [22.5531,114.0679],
    [22.5631,114.0779],
    [22.5731,114.0879]
];

var polyline = L.polyline(path,{color:'cyan'}).addTo(map);

var marker = L.marker(path[0]).addTo(map);

function startTrack(){
    var i = 0;
    var interval = setInterval(function(){
        if(i >= path.length){
            clearInterval(interval);
            return;
        }
        marker.setLatLng(path[i]);
        i++;
    },1000);
}
</script>

</body>
</html>
